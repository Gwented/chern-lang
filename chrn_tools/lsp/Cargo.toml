[package]
name = "chrn_lsp"
version.workspace = true
edition.workspace = true

[dependencies]
chrn_utils = { path = "../../chrn_core/chrn_utils" }
lang = { path = "../../chrn_core/lang/" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "io-std", "fs"] }
compilation = { path = "../../chrn_core/compilation/" }
# serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-lsp = "0.20"
parking_lot = "0.12"

[dev-dependencies]
# Already in the lockfile as transitive dependencies of `tower-lsp`; these entries
# only make them nameable from `src/tests/session.rs`.
futures = "0.3"
tokio = { version = "1", features = ["test-util"] }
tower = "0.4"
