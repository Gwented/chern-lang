<h1>E0001: Config load error</h1>
<p><code>.chrn</code> files go through an initial region loading stage to ensure</p>
<h2>Valid usage of <code>@def</code> and <code>@end</code></h2>
<p>@def with @end</p>
<pre><code class="language-chrn">@def
var-&gt;
    x: i32
    y: i32
@end</code></pre>
<hr>
<p>Only @end</p>
<pre><code class="language-chrn">let chrn = "ch" + "rn"
let super_chrn = "super " + chrn
@end</code></pre>
